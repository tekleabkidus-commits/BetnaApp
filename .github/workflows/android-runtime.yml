name: Exercise Betna on Android
on:
  push:
    branches: [main, fix/betna-browser-stability]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          # The action invokes each script line in a fresh shell. Keep status and cwd in one shell.
          script: |
            adb shell settings put system screen_off_timeout 1800000
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            bash -c 'cd android && { test_status=0; bash gradlew connectedDebugAndroidTest || test_status=$?; adb pull /data/local/tmp/betna-ui-review ../ui-review || true; exit "$test_status"; }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Betna-runtime-${{ matrix.api }}
          path: |
            ui-review/*.png
            android/app/build/reports/androidTests/connected/**
            android/app/build/outputs/androidTest-results/connected/**
